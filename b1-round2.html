<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Etincele Picks</title>
  <meta name="theme-color" content="#f6f1e9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23b8893b' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Name picker -->
  <section id="who" class="who-screen" hidden>
    <div class="brand">Etincele <span>Jewels</span></div>
    <p class="lead">Round 2 · Who's picking?</p>
    <div class="names">
      <button data-name="Ali">Ali</button>
      <button data-name="Jibran">Jibran</button>
      <button data-name="Ayan">Ayan</button>
    </div>
    <p class="hint">Your phone will remember this.</p>
  </section>

  <!-- Main app -->
  <section id="main" class="main" hidden>
    <header class="top">
      <div class="brand small">Etincele <em class="round">R2</em></div>
      <nav class="tabs" role="tablist">
        <button data-tab="pick" class="on">Pick</button>
        <button data-tab="results">Results</button>
      </nav>
      <button id="me" class="me" title="Switch person"></button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <!-- Pick view -->
    <div id="view-pick" class="view pick">
      <div class="cats" id="cats"></div>
      <p class="brief" id="brief"></p>
      <div class="pgrid" id="pgrid"></div>
      <div class="pickbar">
        <div class="pickbar-text">
          <strong id="usedText"></strong>
          <span class="sync" id="sync"></span>
        </div>
        <button id="nextCat" class="nextcat"></button>
      </div>
    </div>

    <!-- Results view -->
    <div id="view-results" class="view r2results" hidden>
      <div class="people" id="people"></div>
      <div class="overall" id="overall"></div>
      <p class="rule">In = picked by 2+ people, best first, up to each category's spots. Ties are broken by Round 1 (3/3 beats 2–1); anything still level is marked <b>Tie</b> for you to discuss.</p>
      <button id="copy" class="copy wide">Copy final list</button>
      <div id="standings"></div>
      <details class="aside">
        <summary id="asideTitle"></summary>
        <div id="asideList"></div>
      </details>
      <a class="r1link" href="b1-round1.html">Round 1 votes →</a>
    </div>
  </section>

  <div id="zoom" class="zoom" hidden><img alt=""></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="round2.js"></script>
</body>
</html>
